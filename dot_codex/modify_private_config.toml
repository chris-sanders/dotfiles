#!/usr/bin/env python3
"""Manage a few top-level Codex settings without replacing other local config.

approval_policy/sandbox_mode: agents (T3 delegates, reviewers) run unattended, so
Codex must never stop on an approval prompt, even for commands it flags as dangerous.
"""

import re
import sys

SETTINGS = {
    "model_auto_compact_token_limit": "268000",
    "approval_policy": '"never"',
    "sandbox_mode": '"danger-full-access"',
}

config = sys.stdin.read()
for key, value in SETTINGS.items():
    setting = f"{key} = {value}"
    assignment = re.compile(rf"(?m)^{key}\s*=.*$")
    if assignment.search(config):
        config = assignment.sub(setting, config, count=1)
        continue
    lines = config.splitlines()
    for index, line in enumerate(lines):
        if re.match(r"\s*\[[^]]+\]", line):
            lines.insert(index, setting)
            break
    else:
        lines.append(setting)
    config = "\n".join(lines)

sys.stdout.write(config.rstrip() + "\n")
